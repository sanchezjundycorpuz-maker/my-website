function roleMemberCount(r){ return state.users.filter(u=>u.role===r.id).length; }

function buildRolesTable(){
  return mountTable("roles", ()=>({
    rows: state.roles.slice(),
    columns: [
      {label:TEXT.colRole, wrap:true, sort:r=>r.label, cell:r=>{
        const input = document.createElement("input");
        input.type = "text";
        input.className = "cell-input cell-input-role";
        input.value = r.label;
        input.onchange = (e)=>{
          const newLabel = e.target.value.trim();
          if(!newLabel){ e.target.value = r.label; return; }
          if(state.roles.some(x=>x.id!==r.id && x.label.toLowerCase()===newLabel.toLowerCase())){
            showToast(TEXT.toastRoleExists);
            e.target.value = r.label;
            return;
          }
          r.label = newLabel;
          saveState();
          showToast(TEXT.toastRoleUpdated);
        };
        return input;
      }},
      {label:TEXT.colAccess, sort:r=>levelName(r.level), cell:r=>{
        const sel = document.createElement("select");
        sel.className = "cell-input";
        [["technician",TEXT.roleTechnician],["manager",TEXT.roleManager],["owner",TEXT.roleOwner]].forEach(([val,label])=>{
          const o = document.createElement("option");
          o.value = val; o.textContent = label;
          if(r.level===val) o.selected = true;
          sel.appendChild(o);
        });
        sel.onchange = (e)=>{
          const newLevel = e.target.value;
          const count = roleMemberCount(r);
          if(count > 0){
            const ok = confirm(TEXT.changeAccessConfirmPrefix + count + TEXT.changeAccessConfirmSuffix);
            if(!ok){ e.target.value = r.level; return; }
          }
          r.level = newLevel;
          saveState();
          showToast(TEXT.toastAccessUpdated);
        };
        return sel;
      }},
      {label:TEXT.colMembers, type:"num", sort:r=>roleMemberCount(r), cell:r=>String(roleMemberCount(r))},
      {label:"", cls:"col-actions", cell:r=>{
        const del = smallBtn(TEXT.removeButton, ()=>{
          if(!confirm("Remove the role \"" + r.label + "\"? This can't be undone.")) return;
          state.roles = state.roles.filter(x=>x.id!==r.id);
          saveState();
          showToast(TEXT.toastRoleRemoved + r.label);
        });
        if(roleMemberCount(r) > 0){
          del.disabled = true;
          del.title = TEXT.removeRoleInUseTitle;
        }
        return actionsCell(del);
      }}
    ],
    stripe: r=>levelColor(r.level),
    select: {
      id: r=>r.id,
      actions: (selected, done)=>[bulkRemoveBtn(selected.filter(r=>roleMemberCount(r)===0), items=>{
        const ids = new Set(items.map(r=>r.id));
        state.roles = state.roles.filter(r=>!ids.has(r.id));
      }, done)]
    },
    emptyTitle: TEXT.emptyNoRolesTitle,
    emptySub: TEXT.emptyNoRolesSub
  }));
}

  })));

function importPartsCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line=>{
    const cols = line.split(",").map(c=>c.trim());
    if(cols.length < 1) return;
    const [itemCode, description, model, brand, quantityRaw] = cols;
    if(!description) return;
    const ldesc = description.toLowerCase();
    if(ldesc==="description" || ldesc==="item description") return; // skip header
    const quantity = parseInt(quantityRaw);
    state.parts.push({
      id: uid(),
      itemCode: itemCode || ("ITEM-" + uid().toUpperCase()),
      description,
      model: model || "",
      brand: brand || "",
      quantity: isNaN(quantity) ? 0 : quantity
    });
    added++;
  });
  saveState();
  return added;
}

function importUsersCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added = 0;
  const validRoles = ["technician","manager","owner"];
  lines.forEach(line=>{
    const cols = line.split(",").map(c=>c.trim());
    if(cols.length < 1) return;
    const [name, username, password, roleRaw] = cols;
    if(!name) return;
    const lname = name.toLowerCase();
    if(lname==="name" || lname==="full name") return; // skip header
    if(!username || !password) return;
    if(state.users.some(u=>(u.username||"").toLowerCase()===username.toLowerCase())) return; // skip duplicates
    const role = validRoles.includes((roleRaw||"").toLowerCase()) ? roleRaw.toLowerCase() : "technician";
    state.users.push({
      id: uid(),
      name,
      username: username.toLowerCase(),
      password,
      role
    });
    added++;
  });
  saveState();
  return added;
}

function importCustomersCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line=>{
    const cols = line.split(",").map(c=>c.trim());
    if(cols.length < 1) return;
    const [name, contact, email, phone, address] = cols;
    if(!name) return;
    const lname = name.toLowerCase();
    if(lname==="name" || lname==="company" || lname==="client name") return; // skip header
    state.customers.push({

      email: email || "",
      phone: phone || "",
      address: address || "",
      since: new Date().toISOString().slice(0,10)
    });
    added++;
  });
  saveState();
  return added;
}

function downloadFile(filename, mimeType, contents){
  const blob = new Blob([contents], {type:mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    [TEXT.summaryCatalogQuantity, String(totalQty)],
    [TEXT.summaryLowStock, String(lowStockCount)],
    [TEXT.summaryCustomersTotal, String(state.customers.length)],
    [TEXT.summaryLocationsTotal, String(state.locations.length)],
    [TEXT.summaryRequestsTotal, String(state.requests.length)],
    [TEXT.summaryRequestLines, String(totalRequestLines())],
    [TEXT.summaryRequestsPending, String(statusCounts.pending)],
    [TEXT.summaryRequestsApproved, String(statusCounts.approved)],
    [TEXT.summaryRequestsFulfilled, String(statusCounts.fulfilled)],
    [TEXT.summaryRequestsRejected, String(statusCounts.rejected)]
  ];

  const table = document.createElement("table");
  table.className = "summary-table";
  rows.forEach(([label, value])=>{
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.className = "summary-label";
    td1.textContent = label;
    const td2 = document.createElement("td");
    td2.className = "summary-value";
    td2.textContent = value;
    tr.append(td1, td2);
    table.appendChild(tr);
  });
  summaryCard.appendChild(table);
  panelGrid.appendChild(summaryCard);

  content.appendChild(panelGrid);
  return content;
}

function renderManagerDetailOverlay(){
  const r = state.requests.find(x=>x.id===view.detailRequestId);
  const overlay = el("div","overlay");
  const top = el("div","overlay-top");
  const back = el("button","back-btn","←");
  back.onclick = ()=>{ view.detailRequestId=null; render(); };
  top.append(back, el("div","overlay-title",TEXT.requestDetailTitle));
  overlay.appendChild(top);

  const body = el("div","overlay-body");
  if(!r){ body.appendChild(renderEmpty(TEXT.emptyNotFoundTitle, TEXT.emptyNotFoundSub)); overlay.appendChild(body); return overlay; }

  const tech = userById(r.technicianId);
  const client = customerById(r.customerId);

  const badgeRow = el("div");
  badgeRow.appendChild(el("span","badge " + statusBadgeClass(r.status), statusLabel(r.status)));
  badgeRow.style.marginBottom="16px";
  if(roleLevel(currentUser())==="owner"){
    const eb = el("button","btn btn-outline btn-sm","Edit request"); eb.style.marginLeft = "10px";
    eb.onclick = ()=>{ view.ownerReqEdit = {id:r.id, draft:ownerReqDraft(r)}; render(); };
    badgeRow.appendChild(eb);
  }
  body.appendChild(badgeRow);

  body.appendChild(detailBlock(TEXT.detailLabelTechnician, tech ? tech.name : "—"));
  body.appendChild(detailBlock(TEXT.detailLabelClient, client ? client.name : "—"));
  if(client && (client.contact || client.phone)){
    body.appendChild(detailBlock(TEXT.detailLabelContact, [client.contact, client.phone].filter(Boolean).join(" · ")));
  }
  body.appendChild(detailBlock(TEXT.detailLabelRequestedLocation, requestedLocationNameOf(r)));

  // Every part on the request, with current stock beside each line
  body.appendChild(requestItemsBlock(r, true));

  const grid = el("div","detail-grid");
  grid.appendChild(detailBlock(TEXT.detailLabelQuantity, String(requestTotalQty(r))));
  grid.appendChild(detailBlock(TEXT.detailLabelUrgency, r.urgency==="urgent"?TEXT.urgencyUrgent:TEXT.urgencyNormal));
  body.appendChild(grid);

  body.appendChild(detailBlock(TEXT.detailLabelSubmitted, fmtDate(r.createdAt)));
  if(r.notes) body.appendChild(detailBlock(TEXT.detailLabelTechNotes, r.notes));

  // The warehouse manager or owner has final say on which location actually
  // releases the parts — defaults to whatever the technician requested, but
  // can be changed to any registered location. Saved immediately on change
  // (not just when the status action fires) so the pick isn't lost if they
  // navigate away before approving/fulfilling.
  if(state.locations.length){
    const locField = el("div","form-field");
    locField.appendChild(el("label",null,TEXT.dispatchLocationFieldLabel));
    const locSel = document.createElement("select");
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = TEXT.dispatchLocationPlaceholder;
    locSel.appendChild(blank);
    state.locations.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(l=>{
      const o = document.createElement("option");
      o.value = l.id;
      o.textContent = l.contact ? `${l.name} — ${l.contact}` : l.name;
      if((r.dispatchLocationId || r.requestedLocationId) === l.id) o.selected = true;
      locSel.appendChild(o);
    });
    locSel.disabled = r.status === "rejected";
    locSel.onchange = (e)=>{
      r.dispatchLocationId = e.target.value || null;
      saveState();
      showToast(TEXT.toastDispatchLocationSet);
    };
    locField.appendChild(locSel);
    body.appendChild(locField);
  }

  const noteField = el("div","form-field");
  noteField.appendChild(el("label",null,TEXT.managerNoteLabel));
  const ta = document.createElement("textarea");
  ta.value = r.managerNote || "";
  ta.placeholder = TEXT.managerNotePlaceholder;
  ta.oninput = (e)=>{ r.managerNote = e.target.value; };
  noteField.appendChild(ta);
  body.appendChild(noteField);

  overlay.appendChild(body);

  const actions = el("div","manager-actions");
  if(r.status==="pending"){
    const approve = el("button","btn btn-accent",TEXT.approveButton);
    approve.onclick = ()=>{ updateStatus(r,"approved"); };
    const reject = el("button","btn btn-outline",TEXT.rejectButton);
    reject.onclick = ()=>{ updateStatus(r,"rejected"); };
    actions.append(reject, approve);
  } else if(r.status==="approved"){
    const fulfill = el("button","btn btn-accent",TEXT.fulfillButton);
    fulfill.onclick = ()=>{ updateStatus(r,"fulfilled"); };
    actions.append(fulfill);
  } else {
    const note = el("div","detail-sub");
    note.style.color = "var(--ink-soft)";
    note.style.fontSize = "13px";
    note.textContent = TEXT.closedRequestNote;
    actions.appendChild(note);
  }
  overlay.appendChild(actions);

  return overlay;
}

function applyStatus(r, status){
  r.status = status;
  r.history = r.history || [];
  r.history.push({status, at: Date.now(), by: currentUser().name});
  if(status==="fulfilled"){
    // Fulfilling pulls every line on the request out of stock
    requestItems(r).forEach(it=>{
      const part = partById(it.partId);
      if(part) part.quantity = Math.max(0, part.quantity - it.qty);
    });
  }
}

function updateStatus(r, status){
  applyStatus(r, status);
  saveState();
  const toastMap = {approved:TEXT.toastApproved, rejected:TEXT.toastRejected, fulfilled:TEXT.toastFulfilled};
  showToast(toastMap[status] || ("Marked " + statusLabel(status).toLowerCase()));
}

/* ---------------- EDIT DRAWER (catalog parts + customers) ---------------- */
const EDIT_FIELDS = {
  part: [
    {key:"type", label:"Category", type:"select"},
    {key:"itemCode", label:TEXT.fieldItemCode, placeholder:TEXT.fieldItemCodePlaceholder, type:"text"},
    {key:"description", label:TEXT.fieldItemDescription, placeholder:TEXT.fieldItemDescriptionPlaceholder, type:"text"},
    {key:"model", label:TEXT.fieldModel, placeholder:TEXT.fieldModelPlaceholder, type:"text"},
    {key:"brand", label:TEXT.fieldBrand, placeholder:TEXT.fieldBrandPlaceholder, type:"text"},
    {key:"quantity", label:TEXT.fieldQuantity, type:"number"}
  ],
  customer: [
    {key:"name", label:TEXT.fieldCustomerName, placeholder:TEXT.fieldCustomerNamePlaceholder, type:"text"},
    {key:"contact", label:TEXT.fieldContactPerson, placeholder:TEXT.fieldContactPersonPlaceholder, type:"text"},
    {key:"email", label:TEXT.fieldEmail, placeholder:TEXT.fieldEmailPlaceholder, type:"email"},
    {key:"phone", label:TEXT.fieldPhone, placeholder:TEXT.fieldPhonePlaceholder, type:"tel"},
    {key:"address", label:TEXT.fieldAddress, placeholder:TEXT.fieldAddressPlaceholder, type:"text"},
    {key:"since", label:TEXT.customerSinceLabel, type:"date"}
  ],
  location: [
    {key:"name", label:TEXT.fieldLocationName, placeholder:TEXT.fieldLocationNamePlaceholder, type:"text"},
    {key:"contact", label:TEXT.fieldLocationContact, placeholder:TEXT.fieldLocationContactPlaceholder, type:"text"},
    {key:"phone", label:TEXT.fieldLocationPhone, placeholder:TEXT.fieldLocationPhonePlaceholder, type:"tel"},
    {key:"address", label:TEXT.fieldLocationAddress, placeholder:TEXT.fieldLocationAddressPlaceholder, type:"text"}
  ]
};
const EDIT_TITLES = {
  part: TEXT.editPartTitle,
  customer: TEXT.editCustomerTitle,
  location: TEXT.editLocationTitle
};

function startEdit(kind, record){
  view.editing = {kind, id: record.id, draft: {...record}};
  render();
}
function closeEdit(){ view.editing = null; render(); }

function saveEdit(){
  const ed = view.editing;
  if(!ed) return;
  const d = ed.draft;
  const clean = k => String(d[k] ?? "").trim();

  if(ed.kind === "part"){
    const p = partById(ed.id);
    if(!p){ closeEdit(); return; }
    if(!clean("description")){ showToast(TEXT.toastEnterPartDescription); return; }
    p.type = state.categories.some(c=>c.id===d.type) ? d.type : ptype(p);
    p.itemCode = clean("itemCode") || p.itemCode;
    p.description = clean("description");
    p.model = clean("model");
    p.brand = clean("brand");
    p.quantity = Math.max(0, parseInt(d.quantity) || 0);
  } else if(ed.kind === "location"){
    const l = locationById(ed.id);
    if(!l){ closeEdit(); return; }
    if(!clean("name")){ showToast(TEXT.toastEnterLocationName); return; }
    l.name = clean("name");
    l.contact = clean("contact");
    l.phone = clean("phone");
    l.address = clean("address");
  } else {
    const c = state.customers.find(x=>x.id===ed.id);
    if(!c){ closeEdit(); return; }
    if(!clean("name")){ showToast(TEXT.toastEnterCustomerName); return; }
    c.name = clean("name");
    c.contact = clean("contact");
    c.email = clean("email");
    c.phone = clean("phone");
    c.address = clean("address");
    c.since = clean("since") || c.since;
  }
  view.editing = null;
  saveState();
  showToast(TEXT.toastChangesSaved);
}

function renderEditDrawer(){
  const ed = view.editing;
  const overlay = el("div","overlay");
  const top = el("div","overlay-top");
  const back = el("button","back-btn","←");
  back.onclick = closeEdit;
  top.append(back, el("div","overlay-title", EDIT_TITLES[ed.kind] || TEXT.editCustomerTitle));
  overlay.appendChild(top);

  const body = el("div","overlay-body");
  EDIT_FIELDS[ed.kind].forEach(f=>{
    const field = el("div","form-field");
    field.appendChild(el("label",null,f.label));
    const input = document.createElement(f.type==="select" ? "select" : "input");
    if(f.type==="select"){ catOptions().forEach(([v,l])=>{ const o=document.createElement("option"); o.value=v; o.textContent=l; input.appendChild(o); }); }
    else input.type = f.type;
    if(f.type === "number") input.min = "0";
    if(f.placeholder) input.placeholder = f.placeholder;
    input.value = ed.draft[f.key] ?? "";
    if(f.type === "date"){
      input.style.width = "100%"; input.style.border = "1.5px solid var(--line)";
      input.style.padding = "11px 12px"; input.style.fontSize = "15px"; input.style.background = "#fff";
    }
    input.oninput = (e)=>{ ed.draft[f.key] = e.target.value; };
    input.onchange = input.oninput;
    input.onkeydown = (e)=>{ if(e.key === "Enter") saveEdit(); };
    field.appendChild(input);
    body.appendChild(field);
  });
  overlay.appendChild(body);

  const actions = el("div","manager-actions");
  const cancel = el("button","btn btn-outline",TEXT.cancelButton);
  cancel.onclick = closeEdit;
  const save = el("button","btn btn-accent",TEXT.saveChangesButton);
  save.onclick = saveEdit;
  actions.append(cancel, save);
  overlay.appendChild(actions);
  return overlay;
}

/* ---------------- shared small ui ---------------- */
function renderEmpty(title, sub){
  const wrap = el("div","empty");
  wrap.appendChild(el("div","empty-title", title));
  wrap.appendChild(el("div","empty-sub", sub));
  return wrap;
}

function el(tag, className, text){
  const e = document.createElement(tag);
  if(className) e.className = className;
  if(text!==undefined && text!==null) e.textContent = text;
  return e;
}

render();
</script>
