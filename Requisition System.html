<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Requisition — Parts Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEEE8;
    --surface:#FFFFFF;
    --ink:#1C2126;
    --ink-soft:#5B6570;
    --line:#D8D9D2;
    --accent:#E8590C;
    --accent-ink:#FFFFFF;
    --steel:#2F5D68;
    --amber:#C98A1B;
    --green:#3F7D4C;
    --red:#B23A2E;
    --font-display:"Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body:"IBM Plex Sans", "Segoe UI", sans-serif;
    /* Side padding. 20px on phones; on desktop it grows so content
       stays centered inside a wide max-width column (see media query). */
    --gutter:20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body.no-scroll{overflow:hidden;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  ::selection{background:var(--accent);color:var(--accent-ink);}

  a{color:inherit;}

  .app{
    width:100%;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top, 0px)) var(--gutter) 14px;
    border-bottom:2px solid var(--ink);
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.3px;
    line-height:1;
  }
  .brand span{color:var(--accent);}
  .brand-sub{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:0.5px;
  }
  .who{
    text-align:right;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .who b{color:var(--ink);font-weight:600;}
  .logout-link{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-size:12px;padding:0;margin-top:2px;
  }

  /* ---------- login ---------- */
  .login-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:36px 28px 60px;
    width:100%;
    max-width:520px;
    margin:0 auto;
  }
  .login-hero{
    font-family:var(--font-display);
    font-weight:700;
    font-size:44px;
    line-height:0.98;
    margin:0 0 6px;
  }
  .login-hero em{
    font-style:normal;
    color:var(--accent);
  }
  .login-lede{
    color:var(--ink-soft);
    font-size:15px;
    margin:0 0 30px;
    max-width:34ch;
  }
  .field-label{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.2px;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:block;
  }
  .name-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:22px;
  }
  .name-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    background:var(--surface);
    border:1.5px solid var(--line);
    cursor:pointer;
    text-align:left;
  }
  .name-option:hover{border-color:var(--ink);}
  .name-option.selected{
    border-color:var(--accent);
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .name-option .n{font-weight:600;font-size:15px;}
  .name-option .r{font-size:11.5px;color:var(--ink-soft);font-family:var(--font-display);letter-spacing:0.4px;}
  .btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    letter-spacing:0.3px;
    padding:14px 20px;
    border:none;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-block{margin-top:4px;}

  /* ---------- nav ---------- */
  .tabs{
    display:flex;
    border-bottom:2px solid var(--ink);
    background:var(--surface);
    overflow-x:auto;
  }
  .tab{
    flex:1;
    padding:13px 8px;
    text-align:center;
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.2px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    background:none;
    border-top:none;border-left:none;border-right:none;
    white-space:nowrap;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);}

  .content{
    flex:1;
    padding:20px var(--gutter) calc(100px + env(safe-area-inset-bottom, 0px));
    overflow-y:auto;
    width:100%;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
  }
  .section-count{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---------- layout helpers ---------- */
  /* panel-grid: stacked form cards on phones, side by side on desktop */
  .panel-grid{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-bottom:18px;
  }
  .panel-grid > .form-card{margin-bottom:0 !important;}

  /* ---------- search ---------- */
  .search-row{
    display:flex;
    border:1.5px solid var(--line);
    background:var(--surface);
    margin-bottom:16px;
  }
  .search-row input{
    flex:1;
    min-width:0;
    border:none;
    padding:11px 12px;
    font-size:14.5px;
    background:transparent;
    color:var(--ink);
    outline:none;
  }
  .search-row .ic{
    display:flex;align-items:center;padding:0 12px;color:var(--ink-soft);
  }

  /* ---------- form ---------- */
  .form-card{
    background:var(--surface);
    border:1.5px solid var(--line);
    padding:18px;
  }
  .form-field{margin-bottom:16px;}
  .form-field label{
    display:block;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.2px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .form-field select,
  .form-field input[type=number],
  .form-field input[type=text],
  .form-field input[type=email],
  .form-field input[type=tel],
  .form-field textarea{
    width:100%;
    border:1.5px solid var(--line);
    padding:11px 12px;
    font-size:15px;
    color:var(--ink);
    background:#fff;
  }
  .form-field textarea{resize:vertical;min-height:70px;}
  .qty-row{display:flex;align-items:center;gap:8px;}
  .qty-btn{
    width:40px;height:40px;
    border:1.5px solid var(--ink);
    background:#fff;
    font-size:18px;font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .qty-row input{width:70px;text-align:center;}
  .report-table td.col-qty{padding-left:8px;padding-right:8px;}
  /* Compact merged stepper used in the "Parts requested" table: one bordered
     pill instead of three separate boxes, sized for a comfortable tap target
     (28px, meeting the WCAG 2.5.8 minimum) without the bulk of the full-size
     qty-row used elsewhere in the app. */
  .qty-stepper{
    display:inline-flex;
    align-items:stretch;
    border:1.5px solid var(--ink);
    background:#fff;
  }
  .qty-stepper button{
    width:28px;height:28px;
    border:none;
    background:transparent;
    font-size:15px;font-weight:600;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  .qty-stepper button:hover{background:#F0F0EB;}
  .qty-stepper button:active{background:#E4E4DD;}
  .qty-stepper input{
    width:34px;height:28px;
    border:none;
    border-left:1.5px solid var(--line);
    border-right:1.5px solid var(--line);
    text-align:center;
    font-size:13.5px;
    padding:0;
    color:var(--ink);
    background:transparent;
    -moz-appearance:textfield;
  }
  .qty-stepper input::-webkit-outer-spin-button,
  .qty-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-stepper button:focus-visible,
  .qty-stepper input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .urgency-row{display:flex;gap:8px;}
  .urgency-opt{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border:1.5px solid var(--line);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .urgency-opt.selected{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);}

  /* ---------- part picker + request lines (new request form) ---------- */
  .picker-results{
    max-height:300px;
    overflow-y:auto;
    border:1.5px solid var(--line);
    background:#fff;
  }
  .picker-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .picker-row:last-child{border-bottom:none;}
  .picker-row:hover{background:#F6F6F2;}
  .picker-row.in-request{box-shadow:inset 3px 0 0 var(--accent);}
  .picker-name{font-weight:600;font-size:14.5px;}
  .picker-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .picker-empty{
    padding:14px 12px;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1.5px dashed var(--line);
  }
  .picker-count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .line-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 12px;
    background:var(--surface);
    border:1.5px solid var(--line);
    box-shadow:inset 3px 0 0 var(--accent);
    margin-bottom:8px;
  }
  .line-info{flex:1;min-width:150px;}
  .line-total{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ---------- request item list (detail overlays) ---------- */
  .item-list{border:1.5px solid var(--line);background:var(--surface);}
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-weight:600;font-size:14.5px;}
  .item-qty{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    white-space:nowrap;
  }

  /* ---------- status badges ---------- */
  .badge{
    font-family:var(--font-display);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.4px;
    padding:3px 8px;
    white-space:nowrap;
  }
  .badge-pending{background:#FBEED2;color:var(--amber);}
  .badge-approved{background:#DCEAE2;color:var(--green);}
  .badge-rejected{background:#F3DCD9;color:var(--red);}
  .badge-fulfilled{background:#1C2126;color:#fff;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .empty-sub{font-size:13.5px;max-width:32ch;margin:0 auto;}

  /* ---------- bottom nav (technician, phones) ---------- */
  .bottom-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    z-index:10;
    display:flex;
    border-top:2px solid var(--ink);
    background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .nav-btn{
    flex:1;
    padding:12px 6px 10px;
    text-align:center;
    background:none;border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    letter-spacing:0.3px;
  }
  .nav-btn .dot{
    width:22px;height:22px;
    margin:0 auto 4px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);
    font-size:13px;
  }
  .nav-btn.active{color:var(--ink);}
  .nav-btn.active .dot{border-color:var(--accent);color:var(--accent);}
  .nav-count{
    display:inline-block;
    margin-left:6px;
    background:var(--accent);
    color:#fff;
    font-size:11.5px;
    padding:1px 6px;
  }

  /* ---------- fab ---------- */
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(78px + env(safe-area-inset-bottom, 0px));
    z-index:10;
    background:var(--accent);
    color:#fff;
    border:none;
    width:56px;height:56px;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.22);
  }

  /* ---------- detail overlay ---------- */
  /* Phones: full screen. Desktop: slide-over drawer on the right. */
  .overlay-backdrop{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:flex-end;
  }
  .overlay{
    width:100%;
    height:100%;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  .overlay-top{
    display:flex;align-items:center;gap:12px;
    padding:calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;
    border-bottom:2px solid var(--ink);
  }
  .back-btn{
    background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);
    padding:0;line-height:1;
  }
  .overlay-title{font-family:var(--font-display);font-weight:700;font-size:20px;}
  .overlay-body{flex:1;overflow-y:auto;padding:20px;}

  .detail-block{margin-bottom:18px;}
  .detail-label{
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .detail-value{font-size:16px;font-weight:500;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .manager-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
    padding:16px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    border-top:1.5px solid var(--line);
  }
  .manager-actions .btn{flex:1;padding:13px 10px;font-size:14.5px;}

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(100px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%);
    max-width:calc(100% - 32px);
    text-align:center;
    background:var(--ink);
    color:#fff;
    padding:11px 18px;
    font-size:13.5px;
    font-weight:500;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .toast.show{opacity:1;}

  .summary-table{
    width:100%;
    border-collapse:collapse;
  }
  .summary-table tr{border-bottom:1px solid var(--line);}
  .summary-table tr:last-child{border-bottom:none;}
  .summary-table td{
    padding:9px 0;
    font-size:13.5px;
    vertical-align:top;
  }
  .summary-label{
    color:var(--ink-soft);
    font-family:var(--font-display);
    font-weight:600;
    letter-spacing:0.2px;
    padding-right:12px;
    white-space:nowrap;
  }
  .summary-value{
    text-align:right;
    font-weight:500;
    color:var(--ink);
  }

  .manager-filter-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:16px;
    padding-bottom:2px;
  }
  .filter-chip{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:7px 13px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
    flex-shrink:0;
  }
  .filter-chip.active{border-color:var(--ink);color:var(--ink);background:var(--ink);color:#fff;}

  /* ---------- data tables (Line Summary Report motif, used everywhere) ---------- */
  .report-table-wrap{
    background:var(--surface);
    border:1.5px solid var(--line);
    overflow-x:auto;
  }
  .report-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    white-space:nowrap;
  }
  .report-table th{
    text-align:left;
    font-family:var(--font-display);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:2px solid var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .report-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .report-table tbody tr:last-child td{border-bottom:none;}
  .report-table tbody tr:hover{background:#F6F6F2;}
  .report-pagination{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-top:1.5px solid var(--line);
    background:var(--surface);
    font-size:12.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
    gap:8px;
  }
  .page-btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:7px 14px;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .page-btn:disabled{opacity:0.35;cursor:not-allowed;}

  .report-table tbody tr.clickable{cursor:pointer;}
  .report-table .stripe-cell{width:6px;min-width:6px;padding:0 !important;}
  .report-table td.cell-wrap{white-space:normal;min-width:170px;}
  /* Any single-line cell (a long email, a long phone number, etc.) truncates
     with an ellipsis instead of overflowing into the next column — the
     overlap that happens when free-text content is wider than its column
     but the cell is still set to nowrap. */
  .report-table td:not(.cell-wrap):not(.check-cell):not(.stripe-cell):not(.col-chevron):not(.col-actions){
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:240px;
  }
  .report-table th.nosort{cursor:default;}
  .report-table .col-chevron{width:28px;text-align:right;color:var(--ink-soft);font-size:18px;padding-left:0;}
  /* width:1% + white-space:nowrap makes the actions column shrink to fit its
     buttons rather than getting squeezed by the other columns, so Edit and
     Remove always sit side by side — the same on every admin table (Catalog,
     Customers, Locations, Team, Roles) — instead of stacking vertically when
     the row runs out of horizontal room. If the table is ever too narrow to
     fit everything, the row scrolls horizontally (report-table-wrap already
     does this) rather than the buttons wrapping onto their own lines. */
  .report-table .col-actions{text-align:right;white-space:nowrap;width:1%;}
  .cell-sub{display:none;font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:pre-line;font-weight:400;}
  .urgent-tag{color:var(--red);font-weight:600;}
  .stock-low{color:var(--red);font-weight:600;}
  .btn-sm{width:auto;padding:7px 12px;font-size:13px;}
  .btn-sm:disabled{opacity:0.4;cursor:not-allowed;}
  .cell-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap;}
  .cell-input{border:1.5px solid var(--line);padding:6px 8px;font-size:14px;background:#fff;color:var(--ink);}
  .cell-input.stock-low{color:var(--red);font-weight:600;}
  .cell-input-qty{width:76px;}
  .cell-input-role{width:100%;min-width:150px;font-weight:600;}
  .table-section-head{margin-top:10px;}

  /* row-selection checkbox column + bulk action bar */
  .report-table .check-cell{width:48px;min-width:48px;text-align:center;padding-left:0 !important;padding-right:0 !important;}
  .row-check{width:18px;height:18px;margin:0;vertical-align:middle;cursor:pointer;accent-color:#0A7AFF;}
  .select-bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 14px;margin-bottom:10px;
    background:var(--surface);border:1.5px solid var(--ink);
  }
  .select-bar .count{
    font-family:var(--font-display);font-weight:600;font-size:15px;margin-right:auto;
  }

  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}

function normalizeState(data){
  // Bring in any seed users (e.g. a newly added owner) not yet in saved data,
  // so updates to the app don't strand existing users without new accounts.
  SEED_USERS.forEach(su=>{
    if(!data.users.some(u=>u.id===su.id)) data.users.push(su);
  });
  // Backfill login credentials onto users saved before login was added.
  data.users.forEach(u=>{
    if(!u.username || !u.password){
      const seed = SEED_USERS.find(su=>su.id===u.id);
      u.username = u.username || (seed ? seed.username : u.name.split(" ")[0].toLowerCase());
      u.password = u.password || (seed ? seed.password : "changeme");
    }
  });
  if(!Array.isArray(data.changes)) data.changes = SEED_CHANGES.map(c=>({...c, items:c.items.map(i=>({...i}))}));
  // Bring in the editable roles list for data saved/restored before roles existed.
  if(!data.roles || !data.roles.length){
    data.roles = SEED_ROLES.map(r=>({...r}));
  }
  if(!Array.isArray(data.activity)) data.activity = [];
  if(!Array.isArray(data.categories) || !data.categories.length) data.categories = SEED_CATEGORIES.map(c=>({...c}));
  data.parts.forEach(p=>{ if(!data.categories.some(c=>c.id===p.type)) p.type = data.categories[0].id; });
  // Migrate parts saved under the old name/category/stock schema.
  data.parts.forEach(p=>{
    if(p.description === undefined){
      p.description = p.name || "";
      p.itemCode = p.itemCode || ("ITEM-" + p.id.toUpperCase());
      p.model = p.model || "";
      p.brand = p.brand || (p.category || "");
      p.quantity = p.quantity !== undefined ? p.quantity : (p.stock || 0);
      delete p.name;
      delete p.category;
      delete p.stock;
    }
  });
  if(!data.requests) data.requests = [];
  if(!data.customers) data.customers = [];
  // Bring in the default warehouse locations for data saved/restored before
  // locations existed, same pattern as roles above.
  if(!data.locations || !data.locations.length){
    data.locations = SEED_LOCATIONS.map(l=>({...l}));
  }
  // Migrate single-part requests to multi-line requests, and make sure every
  // request has a client field (older requests simply have none).
  data.requests.forEach(r=>{
    if(!Array.isArray(r.items) || !r.items.length){
      r.items = r.partId ? [{partId:r.partId, qty:r.qty || 1}] : [];
    }
    r.items = r.items.map(it=>({partId: it.partId, qty: Math.max(1, parseInt(it.qty) || 1)}));
    if(r.customerId === undefined) r.customerId = null;
    // requestedLocationId: the technician's pick when submitting.
    // dispatchLocationId: what the warehouse manager/owner actually decided
    // to release from — may differ from what the technician asked for.
    if(r.requestedLocationId === undefined) r.requestedLocationId = null;
    if(r.dispatchLocationId === undefined) r.dispatchLocationId = null;
    delete r.partId;
    delete r.qty;
  });
  return data;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      return normalizeState(JSON.parse(raw));
    }
  }catch(e){}
  return normalizeState({
    users: SEED_USERS.map(u=>({...u})),
    parts: SEED_PARTS.map(p=>({...p})),
    roles: SEED_ROLES.map(r=>({...r})),
    requests: SEED_REQUESTS.map(r=>({...r, items:(r.items||[]).map(i=>({...i})), history:(r.history||[]).map(h=>({...h}))})),
    customers: SEED_CUSTOMERS.map(c=>({...c})),
    locations: SEED_LOCATIONS.map(l=>({...l})),
    changes: SEED_CHANGES.map(c=>({...c, items:c.items.map(i=>({...i}))})),
    categories: SEED_CATEGORIES.map(c=>({...c})),
    activity: [],
    currentUserId: null
  });
}
function saveState(){ try{ recordActivity(); }catch(e){} try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ================= PENDING-CHANGE APPROVALS (manager → owner) =================
   A manager never edits inventory directly. Every edit/add/remove/import is saved
   as a change record in state.changes with status "pending". Inventory only
   changes when the owner approves; rejected or withdrawn changes touch nothing.
   Several pending changes may touch the same part: each is reviewed in turn,
   and later ones are flagged if inventory moved on since they were submitted. */
/* ---- editable categories (Parts / Printer by default) ---- */
const SEED_CATEGORIES = [{id:"part", name:"Parts"}, {id:"printer", name:"Printer"}];
function catName(id){ const c = state.categories.find(x=>x.id===id); return c ? c.name : "—"; }
function catOptions(){ return state.categories.map(c=>[c.id,c.name]); }
function ptype(p){ return state.categories.some(c=>c.id===p.type) ? p.type : state.categories[0].id; }
function fv(k,v){ return k==="type" ? catName(v) : v; }
function requestCatIds(r){ return [...new Set(requestItems(r).map(it=>{ const p=partById(it.partId); return p ? ptype(p) : null; }).filter(Boolean))]; }
function requestCatNames(r){ return requestCatIds(r).map(catName).join(", ") || "—"; }
function renderCategoriesCard(){
  const card = el("div","form-card"); card.style.marginBottom="18px";
  card.appendChild(el("div","field-label","Categories (used by Requests, Inventory and Catalog)"));
  state.categories.forEach(c=>{
    const row = el("div"); row.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
    const inp = document.createElement("input"); inp.type="text"; inp.value=c.name; inp.style.cssText="flex:1;border:1.5px solid var(--line);padding:9px 11px;font-size:15px";
    inp.onchange = ()=>{
      const n = inp.value.trim();
      if(!n || state.categories.some(x=>x.id!==c.id && x.name.toLowerCase()===n.toLowerCase())){ inp.value=c.name; showToast("Enter a unique category name"); return; }
      c.name = n; saveState(); showToast("Category renamed"); render();
    };
    const used = state.parts.filter(p=>ptype(p)===c.id).length;
    const del = el("button","btn btn-outline btn-sm","Delete");
    del.onclick = ()=>{
      if(state.categories.length<2){ showToast("Keep at least one category"); return; }
      if(used){ showToast("Move its "+used+" item(s) to another category first"); return; }
      if(!confirm("Delete category \""+c.name+"\"?")) return;
      state.categories = state.categories.filter(x=>x.id!==c.id); saveState(); render();
    };
    row.append(inp, el("span","empty-sub",used+" item"+(used===1?"":"s")), del); card.appendChild(row);
  });
  const addRow = el("div"); addRow.style.cssText="display:flex;gap:8px;margin-top:10px";
  const ni = document.createElement("input"); ni.type="text"; ni.placeholder="New category name"; ni.style.cssText="flex:1;border:1.5px solid var(--line);padding:9px 11px;font-size:15px";
  const add = el("button","btn btn-accent btn-sm","Add category");
  add.onclick = ()=>{
    const n = ni.value.trim();
    if(!n || state.categories.some(x=>x.name.toLowerCase()===n.toLowerCase())){ showToast("Enter a unique category name"); return; }
    state.categories.push({id:"cat"+uid(), name:n}); saveState(); showToast("Category added"); render();
  };
  addRow.append(ni, add); card.appendChild(addRow); return card;
}
const CHG_FIELDS = [["type","Category"],["itemCode","Item code"],["description","Description"],["model","Model"],["brand","Brand"],["quantity","Qty"]];
const CHG_TYPES = {edit:"Edit part", add:"Add part", remove:"Remove", import:"CSV import"};
const SEED_CHANGES = [
  {id:"c1", type:"edit", status:"pending", submittedBy:"u4", submittedByName:"Michael Earl Harder", submittedAt:Date.now()-3600e3*20, note:"Recount after delivery",
   items:[{op:"update", partId:"p1", before:{quantity:14}, after:{quantity:20}}], reviewedBy:null, reviewedAt:null, reviewNote:""},
  {id:"c2", type:"edit", status:"approved", submittedBy:"u4", submittedByName:"Michael Earl Harder", submittedAt:Date.now()-3600e3*72, note:"Brand typo",
   items:[{op:"update", partId:"p3", before:{brand:"Honeywel"}, after:{brand:"Honeywell"}}], reviewedBy:"u5", reviewedByName:"Jundy Corpuz", reviewedAt:Date.now()-3600e3*60, reviewNote:"OK"}
];
function chgPartLabel(it){ const p = partById(it.partId); return p ? p.itemCode+" — "+p.description : (it.after && it.after.itemCode) || (it.before && it.before.itemCode) || "(deleted part)"; }
function chgPendingForPart(id){ return state.changes.filter(c=>c.status==="pending" && c.items.some(i=>i.partId===id)); }
function chgItemFlag(it){
  const p = it.partId ? partById(it.partId) : null;
  if(it.op!=="add" && !p) return "missing";
  if(it.op==="update" && Object.keys(it.before||{}).some(k=>String(p[k])!==String(it.before[k]))) return "stale";
  if(it.op==="add" && state.parts.some(x=>x.itemCode===it.after.itemCode)) return "duplicate";
  return "";
}
const CHG_FLAG_TEXT = {missing:"Part no longer exists — will be skipped", stale:"Inventory changed since this was submitted — approving overwrites the newer value", duplicate:"Item code already in inventory"};
function submitChange(type, items, note){
  const u = currentUser();
  state.changes.unshift({id:"c"+uid(), type, status:"pending", submittedBy:u.id, submittedByName:u.name, submittedAt:Date.now(), note:(note||"").trim(), items, reviewedBy:null, reviewedAt:null, reviewNote:""});
  if(roleLevel(u)==="owner"){ reviewChange(state.changes[0],true,"Applied directly by owner"); return; }
  saveState(); showToast("Sent to owner for approval"); render();
}
function withdrawChange(c){ if(c.status!=="pending") return; c.status="withdrawn"; c.reviewedAt=Date.now(); saveState(); showToast("Request withdrawn"); render(); }
function reviewChange(c, approve, note){
  if(c.status!=="pending") return;
  const u = currentUser();
  if(approve){
    c.items.forEach(it=>{
      if(chgItemFlag(it)==="missing") { it.skipped = true; return; }
      if(it.op==="add") state.parts.push({id:uid(), ...it.after});
      else if(it.op==="update") Object.assign(partById(it.partId), it.after);
      else if(it.op==="remove") state.parts = state.parts.filter(p=>p.id!==it.partId);
    });
  }
  Object.assign(c, {status:approve?"approved":"rejected", reviewedBy:u.id, reviewedByName:u.name, reviewedAt:Date.now(), reviewNote:(note||"").trim()});
  saveState(); showToast(approve?"Change approved and applied":"Change rejected"); view.chgDetailId=null; render();
}
function chgBadge(s){ return el("span","badge "+({pending:"badge-pending",approved:"badge-approved",rejected:"badge-rejected",withdrawn:"badge-rejected"}[s]||""), s.charAt(0).toUpperCase()+s.slice(1)); }
function chgSummary(c){ const n=c.items.length; return c.type==="edit"||c.type==="add" ? chgPartLabel(c.items[0]) : n+" part"+(n===1?"":"s"); }
function fmtWhen(t){ return t ? new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}) : ""; }

/* diff table: one row per field that changes */
function renderChangeDiff(c){
  const wrap = el("div"); wrap.style.overflowX="auto";
  const t = document.createElement("table"); t.style.cssText="width:100%;border-collapse:collapse;font-size:13.5px";
  const th = (s)=>{ const x=el("th",null,s); x.style.cssText="text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink);font-size:12px;color:var(--ink-soft)"; return x; };
  const hr = el("tr"); ["Part","Field","Current / before","New"].forEach(s=>hr.appendChild(th(s))); t.appendChild(hr);
  c.items.forEach(it=>{
    const flag = c.status==="pending" ? chgItemFlag(it) : (it.skipped?"missing":"");
    const rows = it.op==="update" ? Object.keys(it.after).map(k=>[k, c.status==="pending" ? (partById(it.partId)||{})[k] : it.before[k], it.after[k]])
      : it.op==="add" ? CHG_FIELDS.map(([k])=>[k,"—",it.after[k]])
      : CHG_FIELDS.map(([k])=>[k,(it.before||{})[k],"(removed)"]);
    rows.forEach(([k,from,to],i)=>{
      const tr = el("tr");
      const label = (CHG_FIELDS.find(f=>f[0]===k)||[,k])[1];
      const cells = [i===0 ? chgPartLabel(it)+(it.op==="add"?" (new)":"") : "", label, from===undefined?"—":String(fv(k,from)), String(fv(k,to))];
      cells.forEach((s,j)=>{ const td=el("td",null,s); td.style.cssText="padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top"+(j===3?";font-weight:600;color:"+(it.op==="remove"?"var(--red)":"var(--green)"):""); tr.appendChild(td); });
      t.appendChild(tr);
    });
    if(flag){ const tr=el("tr"), td=el("td","","⚠ "+CHG_FLAG_TEXT[flag]); td.colSpan=4; td.style.cssText="padding:4px 8px 8px;color:var(--amber);font-size:12.5px"; tr.appendChild(td); t.appendChild(tr); }
  });
  wrap.appendChild(t); return wrap;
}

/* shared detail overlay: owner reviews, manager views/withdraws */
function renderChangeDetailOverlay(){
  const c = state.changes.find(x=>x.id===view.chgDetailId);
  const close = ()=>{ view.chgDetailId=null; render(); };
  const overlay = el("div","overlay"), top = el("div","overlay-top"), back = el("button","back-btn","←");
  back.onclick = close; top.append(back, el("div","overlay-title", c ? CHG_TYPES[c.type] : "Not found")); overlay.appendChild(top);

/* ================= ACTIVITY LOG + UNDO / REDO (owner, in Settings) =================
   Every save is compared with the previous snapshot; the record-level differences
   become one log entry. Undo/redo re-applies those record changes by id. */
var _snapOwner = null, _lastSnap = null, _actBusy = false;
const ACT_COLLS = ["users","parts","roles","requests","customers","locations","categories","changes"];
const ACT_NOUN = {users:"team member",parts:"part",roles:"role",requests:"request",customers:"customer",locations:"location",categories:"category",changes:"inventory change"};
function canon(v){ if(Array.isArray(v)) return "["+v.map(canon).join(",")+"]"; if(v && typeof v==="object") return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}"; return JSON.stringify(v); }
function actSnap(st){ const o={}; ACT_COLLS.forEach(c=>{ o[c]={}; (st[c]||[]).forEach(r=>{ o[c][r.id]=canon(r); }); }); return o; }
function rebaseActivity(){ _snapOwner = state; _lastSnap = actSnap(state); }
function actName(r){ return r ? (r.name||r.description||r.label||r.itemCode||r.id) : ""; }
function actSummary(changes){
  if(changes.length===1){
    const ch = changes[0], rec = ch.a || ch.b, noun = ACT_NOUN[ch.c];
    if(!ch.b) return "Added "+noun+" \""+actName(rec)+"\"";
    if(!ch.a) return "Removed "+noun+" \""+actName(rec)+"\"";
    const keys = Object.keys(ch.a).filter(k=>canon(ch.a[k])!==canon(ch.b[k]));
    if(ch.c==="requests" && keys.includes("status")) return "Set request "+actName(rec)+" to "+ch.a.status;
    return "Edited "+noun+" \""+actName(rec)+"\""+(keys.length ? " ("+keys.slice(0,3).join(", ")+")" : "");
  }
  const counts = {}; changes.forEach(ch=>{ counts[ACT_NOUN[ch.c]] = (counts[ACT_NOUN[ch.c]]||0)+1; });
  return "Updated "+changes.length+" records ("+Object.entries(counts).map(([n,c])=>n+" ×"+c).join(", ")+")";
}
function recordActivity(){
  if(_snapOwner !== state || !_lastSnap){ rebaseActivity(); return; }
  const now = actSnap(state);
  if(_actBusy){ _lastSnap = now; return; }
  const changes = [];
  ACT_COLLS.forEach(c=>{
    const prev = _lastSnap[c] || {};
    new Set(Object.keys(prev).concat(Object.keys(now[c]))).forEach(id=>{
      const b = prev[id], a = now[c][id];
      if(a !== b) changes.push({c, id, b: b ? JSON.parse(b) : null, a: a ? JSON.parse(a) : null});
    });
  });
  _lastSnap = now;
  if(!changes.length) return;
  const u = currentUser(), big = changes.length > 300;
  (state.activity = state.activity || []).unshift({id:"a"+uid(), at:Date.now(), userId:u?u.id:null, userName:u?u.name:"System",
    summary: big ? "Bulk update ("+changes.length+" records)" : actSummary(changes), changes: big ? [] : changes, status:"applied", locked:big, trail:[]});
  if(state.activity.length > 200) state.activity.length = 200;
}
function actConflicts(e, undo){
  return e.changes.filter(ch=>{
    const cur = (state[ch.c]||[]).find(x=>x.id===ch.id);
    return canon(cur||null) !== canon((undo ? ch.a : ch.b) || null);
  }).length;
}
function applyActivity(e, undo){
  if(undo && e.changes.some(ch=>ch.c==="users" && !ch.b && ch.id===state.currentUserId)){ showToast("You can't undo your own account's creation while signed in"); return; }
  e.changes.forEach(ch=>{
    const target = undo ? ch.b : ch.a, arr = state[ch.c], i = arr.findIndex(x=>x.id===ch.id);
    if(!target){ if(i>=0) arr.splice(i,1); }
    else { const rec = JSON.parse(JSON.stringify(target)); if(i>=0) arr[i]=rec; else arr.push(rec); }
  });
  e.status = undo ? "undone" : "applied";
  (e.trail = e.trail||[]).push({at:Date.now(), by:(currentUser()||{}).name||"Owner", action: undo ? "Undone" : "Redone"});
  _actBusy = true; try{ saveState(); } finally{ _actBusy = false; }
  showToast(undo ? "Action undone" : "Action redone"); render();
}

    const l = el("div"); const t = el("div",null,e.summary); t.style.cssText="font-weight:600"+(e.status==="undone"?";text-decoration:line-through;color:var(--ink-soft)":""); l.appendChild(t);
    const last = (e.trail||[]).slice(-1)[0];
    const m = el("div","empty-sub",e.userName+" · "+fmtWhen(e.at)+(last?" · "+last.action+" by "+last.by:"")); m.style.cssText="margin:2px 0 0;text-align:left;max-width:none"; l.appendChild(m);
    const undo = e.status!=="undone", b = el("button","btn btn-outline btn-sm", e.locked ? "Not undoable" : undo ? "Undo" : "Redo");

// Keep every open tab/account in step: when another tab saves, adopt its data
// (but keep this tab's own logged-in user), and re-check when a tab regains focus.
function syncFromStorage(){
  try{
    const raw = localStorage.getItem(STORE_KEY); if(!raw) return;
    const incoming = JSON.parse(raw); incoming.currentUserId = state.currentUserId;
    const next = normalizeState(incoming);
    if(JSON.stringify(next) === JSON.stringify(state)) return;
    state = next; rebaseActivity(); render();
  }catch(e){}
}
window.addEventListener("storage", e=>{ if(e.key === STORE_KEY) syncFromStorage(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncFromStorage(); });

/* ---- multi-part request helpers ----
   Every request carries items:[{partId, qty}]. These read that list safely
   (including for any legacy single-part request that slipped through). */
function requestItems(r){
  if(Array.isArray(r.items) && r.items.length) return r.items;
  if(r.partId) return [{partId:r.partId, qty:r.qty || 1}];
  return [];
}
function requestTotalQty(r){
  return requestItems(r).reduce((sum,it)=>sum + (it.qty||0), 0);
}
function requestPartNames(r){
  return requestItems(r).map(it=>{
    const p = partById(it.partId);
    return p ? p.description : "(removed part)";
  });
}
function requestItemCodes(r){
  return requestItems(r).map(it=>{
    const p = partById(it.partId);
    return p ? (p.itemCode || "") : "";
  });
}
function requestPartSummary(r){
  const names = requestPartNames(r);
  if(!names.length) return "—";
  if(names.length === 1) return names[0];
  return names[0] + "  +" + (names.length - 1) + " more";
}
function requestCodeSummary(r){
  const codes = requestItemCodes(r).filter(Boolean);
  if(!codes.length) return "—";
  if(codes.length === 1) return codes[0];
  return codes[0] + " +" + (codes.length - 1);
}
function totalRequestLines(){
  return state.requests.reduce((sum,r)=>sum + requestItems(r).length, 0);
}

function render(){
  const app = document.getElementById("app");

    app.appendChild(renderLogin());
  } else {
    const user = currentUser();
    if(roleLevel(user) === "technician"){

}

function attemptLogin(){
  const uname = view.loginUsername.trim().toLowerCase();
  const pass = view.loginPassword;
  if(!uname || !pass){
    view.loginError = TEXT.loginErrorEmpty;
    render();
    return;
  }
  const match = state.users.find(u=>(u.username||"").toLowerCase()===uname);
  if(!match || match.password !== pass){
    view.loginError = TEXT.loginErrorNoMatch;
    render();
    return;
  }
  state.currentUserId = match.id;
  view.screen = roleLevel(match)==="technician" ? "tech-home" : roleLevel(match)==="owner" ? "owner-home" : "mgr-home";
  view.loginUsername = "";
  view.loginPassword = "";
  view.loginError = null;
  saveState();
  render();
}

// Shared "type to filter, tap to select" control used for both the Client
// and Location fields on the new-request form. Once something is chosen the
// section collapses to a single summary row with a Change button, instead of
// a dropdown, so it reads the same as the parts picker below it.
// opts: {getItems, getId, match, primary, secondary, getSelectedId,
//        setSelectedId, getSearch, setSearch, searchPlaceholder,
//        noMatchesText, matchSuffix, showingAllText, selectLabel,
//        changeLabel, sortFn, onChange}
function buildSearchSelect(container, opts){
  function draw(){
    container.innerHTML = "";
    const items = opts.getItems();
    const selId = opts.getSelectedId();
    const chosen = selId ? items.find(it=>opts.getId(it)===selId) : null;
    if(opts.onChange) opts.onChange();

    if(chosen){
      const row = el("div","line-row");
      const info = el("div","line-info");
      info.appendChild(el("div","picker-name", opts.primary(chosen)));
      const sub = opts.secondary(chosen);
      if(sub) info.appendChild(el("div","picker-sub", sub));
      row.appendChild(info);
      row.appendChild(smallBtn(opts.changeLabel, ()=>{
        opts.setSelectedId(null);
        opts.setSearch("");
        draw();
      }));
      container.appendChild(row);
      return;
    }

    const searchRow = el("div","search-row picker-search");
    searchRow.style.marginBottom = "10px";
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = opts.searchPlaceholder;
    searchInput.value = opts.getSearch();
    searchRow.appendChild(searchInput);

    const results = el("div","picker-results");
    const count = el("div","picker-count");

    function drawList(){
      results.innerHTML = "";
      const q = (opts.getSearch() || "").trim().toLowerCase();
      let list = items.slice();
      if(opts.sortFn) list.sort(opts.sortFn);
      if(q) list = list.filter(it=>opts.match(it, q));
      count.textContent = q ? (list.length + opts.matchSuffix) : opts.showingAllText;
      if(!list.length){
        results.appendChild(el("div","picker-empty", opts.noMatchesText));
        return;
      }
      list.forEach(it=>{
        const row = el("div","picker-row");
        const info = el("div");
        info.appendChild(el("div","picker-name", opts.primary(it)));
        const sub = opts.secondary(it);
        if(sub) info.appendChild(el("div","picker-sub", sub));
        row.appendChild(info);
        const btn = el("button","btn btn-outline btn-sm", opts.selectLabel);
        btn.type = "button";
        row.appendChild(btn);
        row.onclick = ()=>{
          opts.setSelectedId(opts.getId(it));
          draw();
        };
        results.appendChild(row);
      });
    }

    searchInput.oninput = (e)=>{ opts.setSearch(e.target.value); drawList(); };
    container.append(searchRow, results, count);
    drawList();
  }
  draw();
}

function renderNewRequestForm(){
  const wrap = el("div");
  wrap.style.maxWidth = "820px";
  const head = el("div","section-head");
  head.appendChild(el("div","section-title",TEXT.newRequestTitle));
  head.appendChild(el("div","section-count", view.newRequestLines.length + " line item(s)"));
  wrap.appendChild(head);

  const card = el("div","form-card");

  // The Reset button's enabled/disabled state depends on live form state, but
  // most edits (adding a part, picking a client or location) only redraw
  // their own section rather than the whole form. Both those redraw paths
  // call this so the button never gets stuck showing a stale state.
  let resetBtn = null;
  function updateResetState(){
    if(!resetBtn) return;
    const hasAnything = view.newRequestLines.length || view.newRequestCustomerId ||
      view.newRequestLocationId || view.newRequestNotes.trim() || view.newRequestUrgency !== "normal";
    resetBtn.disabled = !hasAnything;
  }

  /* ---- Client ---- */
  const clientField = el("div","form-field");
  clientField.appendChild(el("label",null,TEXT.fieldClientLabel));
  if(!state.customers.length){
    const none = el("div","picker-empty", TEXT.emptyNoClientsForTechSub);
    clientField.appendChild(none);
  } else {
    const clientHolder = el("div");
    clientField.appendChild(clientHolder);
    buildSearchSelect(clientHolder, {
      getItems: ()=> state.customers,
      getId: c=>c.id,
      match: (c,q)=>[c.name, c.contact, c.email, c.phone, c.address].some(s=>(s||"").toLowerCase().includes(q)),
      primary: c=>c.name,
      secondary: c=>[c.contact, c.phone, c.address].filter(Boolean).join(" · "),
      getSelectedId: ()=>view.newRequestCustomerId,
      setSelectedId: id=>{ view.newRequestCustomerId = id; },
      getSearch: ()=>view.clientPickerSearch,
      setSearch: v=>{ view.clientPickerSearch = v; },
      searchPlaceholder: TEXT.clientSearchPlaceholder,
      noMatchesText: TEXT.clientNoMatches,
      matchSuffix: TEXT.clientMatchSuffix,
      showingAllText: TEXT.clientShowingAll,
      selectLabel: TEXT.selectClientButton,
      changeLabel: TEXT.changeClientButton,
      sortFn: (a,b)=>a.name.localeCompare(b.name),
      onChange: updateResetState
    });
  }
  card.appendChild(clientField);

  /* ---- Location: which warehouse the technician would prefer to pick up
     from / have parts dispatched from. The warehouse manager or owner has
     the final say and can pick a different one when they review the
     request (see renderManagerDetailOverlay). ---- */
  const locationField = el("div","form-field");
  locationField.appendChild(el("label",null,TEXT.fieldLocationLabel));
  if(!state.locations.length){
    locationField.appendChild(el("div","picker-empty", TEXT.emptyNoLocationsForTechSub));
  } else {
    const locationHolder = el("div");
    locationField.appendChild(locationHolder);
    buildSearchSelect(locationHolder, {
      getItems: ()=> state.locations,
      getId: l=>l.id,
      match: (l,q)=>[l.name, l.contact, l.phone, l.address].some(s=>(s||"").toLowerCase().includes(q)),
      primary: l=>l.name,
      secondary: l=>[l.contact, l.phone, l.address].filter(Boolean).join(" · "),
      getSelectedId: ()=>view.newRequestLocationId,
      setSelectedId: id=>{ view.newRequestLocationId = id; },
      getSearch: ()=>view.locationPickerSearch,
      setSearch: v=>{ view.locationPickerSearch = v; },
      searchPlaceholder: TEXT.locationSearchPlaceholder,
      noMatchesText: TEXT.locationNoMatches,
      matchSuffix: TEXT.locationMatchSuffix,
      showingAllText: TEXT.locationShowingAll,
      selectLabel: TEXT.selectLocationButton,
      changeLabel: TEXT.changeLocationButton,
      sortFn: (a,b)=>a.name.localeCompare(b.name),
      onChange: updateResetState
    });
  }
  card.appendChild(locationField);

  /* ---- Searchable part picker ---- */
  const pickField = el("div","form-field");
  pickField.appendChild(el("label",null,TEXT.fieldPartSearchLabel));
  const searchRow = el("div","search-row picker-search");
  searchRow.style.marginBottom = "10px";
  const searchInput = document.createElement("input");
  searchInput.type = "text";
  searchInput.placeholder = TEXT.partSearchPlaceholder;
  searchInput.value = view.partPickerSearch;
  searchRow.appendChild(searchInput);
  pickField.appendChild(searchRow);
  view.newReqCat = view.newReqCat || "all";
  if(view.newReqCat !== "all" && !state.categories.some(c=>c.id===view.newReqCat)) view.newReqCat = "all";
  const catChips = el("div","manager-filter-row");
  catChips.style.marginBottom = "10px";
  function drawCatChips(){
    catChips.innerHTML = "";
    [["all","All categories",state.parts.length]].concat(state.categories.map(c=>[c.id,c.name,state.parts.filter(p=>ptype(p)===c.id).length])).forEach(([key,label,n])=>{
      const chip = el("div","filter-chip"+(view.newReqCat===key?" active":""), label+" ("+n+")");
      chip.onclick = ()=>{ view.newReqCat = key; drawCatChips(); drawResults(); };
      catChips.appendChild(chip);
    });
  }
  drawCatChips();
  pickField.appendChild(catChips);
  const results = el("div","picker-results");
  pickField.appendChild(results);
  const resultCount = el("div","picker-count");
  pickField.appendChild(resultCount);
  card.appendChild(pickField);

  /* ---- Lines on this request ---- */
  const linesField = el("div","form-field");
  linesField.appendChild(el("label",null,TEXT.requestLinesHeading));
  const linesHolder = el("div");
  linesField.appendChild(linesHolder);
  card.appendChild(linesField);

  function lineFor(partId){ return view.newRequestLines.find(l=>l.partId===partId); }

  function drawResults(){
    results.innerHTML = "";
    const q = (view.partPickerSearch || "").trim().toLowerCase();
    let list = state.parts.filter(p=>view.newReqCat==="all" || ptype(p)===view.newReqCat);
    if(q) list = list.filter(p=>partMatch(p, q));
    resultCount.textContent = (q || view.newReqCat!=="all") ? (list.length + TEXT.pickerMatchSuffix) : TEXT.pickerShowingAll;
    if(!list.length){
      results.appendChild(el("div","picker-empty", TEXT.pickerNoMatches));
      return;
    }
    list.forEach(p=>{
      const ln = lineFor(p.id);
      const row = el("div","picker-row" + (ln ? " in-request" : ""));
      const info = el("div");
      info.appendChild(el("div","picker-name", p.description));
      info.appendChild(el("div","picker-sub", [partSubLine(p), p.quantity + TEXT.catalogStockSuffix].filter(Boolean).join(" · ")));
      row.appendChild(info);
      const btn = el("button","btn btn-outline btn-sm", ln ? (TEXT.addedSuffix + ln.qty) : TEXT.addToRequestButton);
      btn.type = "button";
      row.appendChild(btn);
      row.onclick = ()=>{ addLineForPart(p.id); refresh(); };
      results.appendChild(row);
    });
  }

  function drawLines(){
    linesHolder.innerHTML = "";
    if(!view.newRequestLines.length){
      linesHolder.appendChild(el("div","picker-empty", TEXT.requestLinesEmpty));
      return;
    }

    const wrap = el("div","report-table-wrap");
    const table = document.createElement("table");
    table.className = "report-table";

    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    [TEXT.colItemCode, TEXT.colPart, TEXT.colBrand, TEXT.colModel, TEXT.colQty, ""].forEach((label,i)=>{
      const th = document.createElement("th");
      th.textContent = label;
      th.className = "nosort" + ([0,2,3].includes(i) ? " col-hide-sm" : "");
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    view.newRequestLines.forEach(l=>{
      const p = partById(l.partId);
      const tr = document.createElement("tr");

      const codeTd = document.createElement("td");
      codeTd.className = "col-hide-sm";
      codeTd.textContent = p ? (p.itemCode || "—") : "—";
      tr.appendChild(codeTd);

      const partTd = document.createElement("td");
      partTd.className = "cell-wrap";
      partTd.appendChild(cellSub(
        p ? p.description : "(removed part)",
        p ? [partSubLine(p), p.quantity + TEXT.catalogStockSuffix].filter(Boolean).join(" · ") : ""
      ));
      tr.appendChild(partTd);

      const brandTd = document.createElement("td");
      brandTd.className = "col-hide-sm";
      brandTd.textContent = p ? (p.brand || "—") : "—";
      tr.appendChild(brandTd);

      const modelTd = document.createElement("td");
      modelTd.className = "col-hide-sm";
      modelTd.textContent = p ? (p.model || "—") : "—";
      tr.appendChild(modelTd);

      const qtyTd = document.createElement("td");
      qtyTd.className = "col-qty";
      const stepper = el("div","qty-stepper");
      const partName = p ? p.description : "part";
      const minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "–";
      minus.setAttribute("aria-label", "Decrease quantity for " + partName);
      minus.onclick = ()=>{ l.qty = Math.max(1, l.qty - 1); refresh(); };
      const qi = document.createElement("input");
      qi.type = "number"; qi.min = "1"; qi.value = l.qty;
      qi.inputMode = "numeric";
      qi.setAttribute("aria-label", "Quantity for " + partName);
      qi.oninput = (e)=>{ l.qty = Math.max(1, parseInt(e.target.value) || 1); };
      qi.onblur = ()=>{ refresh(); };
      const plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "Increase quantity for " + partName);
      plus.onclick = ()=>{ l.qty += 1; refresh(); };
      stepper.append(minus, qi, plus);
      qtyTd.appendChild(stepper);
      tr.appendChild(qtyTd);

      const actionTd = document.createElement("td");
      actionTd.className = "col-actions";
      actionTd.appendChild(smallBtn(TEXT.removeLineButton, ()=>{
        if(!confirm("Remove this item from the request?")) return;
        view.newRequestLines = view.newRequestLines.filter(x=>x!==l);
        refresh();
      }));
      tr.appendChild(actionTd);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    const total = view.newRequestLines.reduce((s,l)=>s + l.qty, 0);
    const pag = el("div","report-pagination");
    pag.appendChild(el("div", null,
      TEXT.lineTotalPrefix + total + TEXT.lineTotalSuffix + view.newRequestLines.length + TEXT.lineTotalSuffix2));
    wrap.appendChild(pag);

    linesHolder.appendChild(wrap);
  }

  function refresh(){ drawResults(); drawLines(); updateResetState(); }

  searchInput.oninput = (e)=>{ view.partPickerSearch = e.target.value; drawResults(); };
  refresh();

  /* ---- Urgency ---- */
  const f3 = el("div","form-field");
  f3.appendChild(el("label",null,TEXT.fieldUrgencyLabel));
  const urow = el("div","urgency-row");
  ["normal","urgent"].forEach(u=>{
    const o = el("div","urgency-opt" + (view.newRequestUrgency===u ? " selected":""), u==="normal"?TEXT.urgencyNormal:TEXT.urgencyUrgent);
    o.onclick = ()=>{
      view.newRequestUrgency = u;
      Array.from(urow.children).forEach((c,i)=>c.classList.toggle("selected", (i===0) === (u==="normal")));
      updateResetState();
    };
    urow.appendChild(o);
  });
  f3.appendChild(urow);
  card.appendChild(f3);

  /* ---- Notes ---- */
  const f4 = el("div","form-field");
  f4.appendChild(el("label",null,TEXT.fieldNotesLabel));
  const ta = document.createElement("textarea");
  ta.placeholder = TEXT.fieldNotesPlaceholder;
  ta.value = view.newRequestNotes;
  ta.oninput = (e)=>{ view.newRequestNotes = e.target.value; updateResetState(); };
  f4.appendChild(ta);
  card.appendChild(f4);

  const submit = el("button","btn btn-accent btn-block",TEXT.submitRequestButton);
  submit.onclick = ()=>{
    if(!view.newRequestLines.length){ showToast(TEXT.toastAddPartsFirst); return; }
    if(REQUIRE_CLIENT && state.customers.length && !view.newRequestCustomerId){ showToast(TEXT.toastChooseClientFirst); return; }
    if(REQUIRE_LOCATION && state.locations.length && !view.newRequestLocationId){ showToast(TEXT.toastChooseLocationFirst); return; }
    const req = {
      id: uid(),
      customerId: view.newRequestCustomerId || null,
      requestedLocationId: view.newRequestLocationId || null,
      dispatchLocationId: null,
      items: view.newRequestLines.map(l=>({partId:l.partId, qty:l.qty})),
      urgency: view.newRequestUrgency,
      notes: view.newRequestNotes,
      technicianId: currentUser().id,
      status: "pending",
      createdAt: Date.now(),
      managerNote: "",
      history: [{status:"pending", at: Date.now(), by: currentUser().name}]
    };
    state.requests.unshift(req);
    saveState();
    resetNewRequestForm();
    view.techTab = "mine";
    showToast(TEXT.toastRequestSubmitted);
  };
  card.appendChild(submit);

  resetBtn = el("button","btn btn-outline btn-block",TEXT.resetRequestButton);
  resetBtn.type = "button";
  resetBtn.style.marginTop = "10px";
  resetBtn.onclick = ()=>{
    if(!confirm("Clear this request and start over?")) return;
    // Just clears the unsubmitted draft (client, every part line, and its
    // quantity) — nothing saved is touched, so this fires immediately with
    // no confirm dialog to get in the way.
    resetNewRequestForm();
    showToast(TEXT.toastRequestReset);
  };
  card.appendChild(resetBtn);
  updateResetState();

  wrap.appendChild(card);
  return wrap;
}

/* ---------------- REQUESTS PANEL (shared by manager + owner) ---------------- */
function renderRequestsPanel(){
  const content = el("div","content");
  content.style.paddingBottom = "40px";

  const head = el("div","section-head");
  head.appendChild(el("div","section-title",TEXT.incomingRequestsTitle));
  const total = state.requests.length;
  head.appendChild(el("div","section-count", total + " total"));
  content.appendChild(head);

  const filters = el("div","manager-filter-row");
  [["pending",TEXT.filterPending],["approved",TEXT.filterApproved],["fulfilled",TEXT.filterFulfilled],["rejected",TEXT.filterRejected],["all",TEXT.filterAll]].forEach(([key,label])=>{
    const chip = el("div","filter-chip" + (view.mgrFilter===key ? " active":""), label);
    chip.onclick = ()=>{ view.mgrFilter = key; render(); };
    filters.appendChild(chip);
  });
  content.appendChild(filters);
  if(view.reqCat!=="all" && !state.categories.some(c=>c.id===view.reqCat)) view.reqCat = "all";
  const catRow = el("div","manager-filter-row");
  [["all","All categories"]].concat(catOptions()).forEach(([key,label])=>{
    const chip = el("div","filter-chip"+(view.reqCat===key?" active":""), label);
    chip.onclick = ()=>{ view.reqCat = key; render(); };
    catRow.appendChild(chip);
  });
  content.appendChild(catRow);

  let list = state.requests;
  if(view.mgrFilter !== "all") list = list.filter(r=>r.status===view.mgrFilter);
  if(view.reqCat !== "all") list = list.filter(r=>requestCatIds(r).includes(view.reqCat));

  content.appendChild(mountTable("requests", ()=>({
    rows: requestTableRows(list),
    columns: requestColumns(true),
    stripe: x=>stripeColor(x.req.status),
    onRowClick: openRequest,
    select: {
      id: x=>x.req.id,
      actions: (selected, done)=>{
        const pending = selected.filter(x=>x.req.status==="pending");
        const approved = selected.filter(x=>x.req.status==="approved");
        const bulk = (label, list, status)=>smallBtn(`${label} (${list.length})`, ()=>{
          list.forEach(x=>applyStatus(x.req, status));
          saveState();
          done();
          showToast(list.length + TEXT.toastBulkUpdated);
        });
        const out = [];
        if(pending.length){
          out.push(bulk(TEXT.approveButton, pending, "approved"));
          out.push(bulk(TEXT.rejectButton, pending, "rejected"));
        }
        if(approved.length) out.push(bulk(TEXT.fulfillButton, approved, "fulfilled"));
        return out;
      }
    },
    search: list.length ? {placeholder: TEXT.requestsSearchPlaceholder, match: requestMatch} : null,
    // until a column header is clicked: pending first, urgent first, then newest
    defaultCompare: (a,b)=>{
      if(a.req.status==="pending" && b.req.status!=="pending") return -1;
      if(b.req.status==="pending" && a.req.status!=="pending") return 1;
      if(a.req.urgency==="urgent" && b.req.urgency!=="urgent") return -1;
      if(b.req.urgency==="urgent" && a.req.urgency!=="urgent") return 1;
      return b.req.createdAt - a.req.createdAt;
    },
    emptyTitle: TEXT.emptyNothingHereTitle,
    emptySub: TEXT.emptyNothingHereSub
  })));

  return content;
}

/* ---------------- GENERIC DATA TABLE (same motif as the Line Summary Report) ----------------
   mountTable(key, getCfg) builds a sortable, paginated, optionally searchable table.
   getCfg() returns:
     rows            array of row objects
     columns         [{label, cell(row)->string|Node, sort(row)->value, type:"num" (sort high→low first),
                       hideSmall (fold into a sub-line on phones), wrap, cls}]
     stripe(row)     optional colour for the left status stripe
     onRowClick(row) optional; makes rows tappable
     search          optional {placeholder, match(row, q)}
     defaultSort     optional {by:columnIndex, dir:"asc"|"desc"}   defaultCompare  optional (a,b)=>number
     emptyTitle / emptySub
   Sort, page and search are remembered in view.tables[key]. */
const TABLE_PAGE_SIZE = 10;
const PAGE_SIZE_OPTIONS = [10, 25, 50, "all"];
function effectivePageSize(setting, total){
  if(setting === "all") return Math.max(total, 1);
  return setting || TABLE_PAGE_SIZE;
}
// "Rows per page" dropdown shared by every table footer (including the Line Summary Report)
function pageSizeControl(setting, onChange){
  const wrap = el("label");
  wrap.style.display = "flex"; wrap.style.alignItems = "center"; wrap.style.gap = "8px";
  wrap.appendChild(el("span", null, TEXT.paginationRowsPerPage));
  const sel = document.createElement("select");
  sel.className = "cell-input";
  PAGE_SIZE_OPTIONS.forEach(opt=>{
    const o = document.createElement("option");
    o.value = String(opt);
    o.textContent = opt === "all" ? TEXT.paginationAll : String(opt);
    if(String(setting) === String(opt)) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = (e)=>{
    const v = e.target.value;
    onChange(v === "all" ? "all" : parseInt(v, 10));
  };
  wrap.appendChild(sel);
  return wrap;
}
function tableState(key){
  if(!view.tables[key]) view.tables[key] = {sortBy:null, sortDir:"asc", page:1, search:"", pageSize:TABLE_PAGE_SIZE};
  return view.tables[key];
}
function selectionOf(key){
  if(!view.selected[key]) view.selected[key] = {};
  return view.selected[key];
}
// "Remove selected (n)" button used by the tables that support deleting rows
function bulkRemoveBtn(items, removeFn, done){
  const b = smallBtn(`${TEXT.removeSelectedButton} (${items.length})`, ()=>{
    if(!confirm(TEXT.removeSelectedConfirmPrefix + items.length + TEXT.removeSelectedConfirmSuffix)) return;
    removeFn(items);
    saveState();
    done();
    showToast(TEXT.toastRemovedPrefix + items.length + " item" + (items.length===1 ? "" : "s"));
  });
  if(!items.length) b.disabled = true;
  return b;
}
function cellSub(main, sub){
  const w = el("div");
  w.appendChild(el("div", null, main));
  if(sub) w.appendChild(el("div", "cell-sub", sub));
  return w;
}
function smallBtn(label, onclick){
  const b = el("button", "btn btn-outline btn-sm", label);
  b.type = "button";
  b.onclick = (e)=>{ e.stopPropagation(); onclick(e); };
  return b;
}
function actionsCell(...btns){
  const d = el("div", "cell-actions");
  btns.filter(Boolean).forEach(b=>d.appendChild(b));
  return d;
}
function levelName(level){ return level==="owner" ? TEXT.roleOwner : level==="manager" ? TEXT.roleManager : TEXT.roleTechnician; }
function levelColor(level){ return level==="owner" ? "var(--accent)" : level==="manager" ? "var(--steel)" : "var(--ink-soft)"; }

function mountTable(key, getCfg){
  const box = el("div");
  const ts = tableState(key);
  const first = getCfg();
  let holder;
  const draw = ()=>{ holder.innerHTML = ""; holder.appendChild(buildDataTable(key, getCfg(), draw)); };

  if(first.search){
    const row = el("div", "search-row");
    const input = document.createElement("input");
    input.placeholder = first.search.placeholder || "";
    input.value = ts.search || "";
    input.oninput = (e)=>{ ts.search = e.target.value; ts.page = 1; draw(); };
    row.appendChild(input);
    box.appendChild(row);
  }
  holder = el("div");
  box.appendChild(holder);
  draw();
  return box;
}

function buildDataTable(key, cfg, redraw){
  const ts = tableState(key);
  const selMap = cfg.select ? selectionOf(key) : null;
  const frag = el("div");
  let rows = cfg.rows.slice();

  const q = (ts.search || "").trim().toLowerCase();
  if(q && cfg.search) rows = rows.filter(r=>cfg.search.match(r, q));

  // effective sort: what the person clicked, else the table's default
  let eff = null;
  if(ts.sortBy !== null && cfg.columns[ts.sortBy] && cfg.columns[ts.sortBy].sort){
    eff = {by: ts.sortBy, dir: ts.sortDir};
  } else if(cfg.defaultSort){
    eff = cfg.defaultSort;
  }
  if(eff){
    const col = cfg.columns[eff.by];
    const mult = eff.dir === "asc" ? 1 : -1;
    rows.sort((a,b)=>{
      let av = col.sort(a), bv = col.sort(b);
      if(typeof av === "string") av = av.toLowerCase();
      if(typeof bv === "string") bv = bv.toLowerCase();
      if(av < bv) return -mult;
      if(av > bv) return mult;
      return 0;
    });
  } else if(cfg.defaultCompare){
    rows.sort(cfg.defaultCompare);
  }

  if(cfg.select){
    const selectedRows = cfg.rows.filter(r=>selMap[cfg.select.id(r)]);
    if(selectedRows.length){
      const bar = el("div", "select-bar");
      bar.appendChild(el("div", "count", selectedRows.length + TEXT.selectedSuffix));
      const done = ()=>{ view.selected[key] = {}; };
      (cfg.select.actions ? cfg.select.actions(selectedRows, done) : []).forEach(b=>bar.appendChild(b));
      bar.appendChild(smallBtn(TEXT.clearSelectionButton, ()=>{ view.selected[key] = {}; redraw(); }));
      frag.appendChild(bar);
    }
  }

  if(rows.length === 0){
    if(cfg.rows.length === 0) frag.appendChild(renderEmpty(cfg.emptyTitle || TEXT.emptyNoMatchesTitle, cfg.emptySub || TEXT.emptyNoMatchesSub));
    else frag.appendChild(renderEmpty(TEXT.emptyNoMatchesTitle, TEXT.emptyNoMatchesSub));
    return frag;
  }

  const pageSize = effectivePageSize(ts.pageSize, rows.length);
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if(ts.page > totalPages) ts.page = totalPages;
  if(ts.page < 1) ts.page = 1;
  const startIdx = (ts.page - 1) * pageSize;
  const pageRows = rows.slice(startIdx, startIdx + pageSize);

  const wrap = el("div", "report-table-wrap");
  const table = document.createElement("table");
  table.className = "report-table";

  // header
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  if(cfg.select){
    const th = document.createElement("th");
    th.className = "check-cell nosort";
    const all = document.createElement("input");
    all.type = "checkbox";
    all.className = "row-check";
    all.setAttribute("aria-label", TEXT.selectAllLabel);
    const nChecked = rows.filter(r=>selMap[cfg.select.id(r)]).length;
    all.checked = rows.length > 0 && nChecked === rows.length;
    all.indeterminate = nChecked > 0 && nChecked < rows.length;
    all.onchange = ()=>{
      rows.forEach(r=>{
        const id = cfg.select.id(r);
        if(all.checked) selMap[id] = true; else delete selMap[id];
      });
      redraw();
    };
    th.appendChild(all);
    trh.appendChild(th);
  } else if(cfg.stripe){
    const th = document.createElement("th");
    th.className = "stripe-cell nosort";
    trh.appendChild(th);
  }
  cfg.columns.forEach((col, idx)=>{
    const th = document.createElement("th");
    const arrow = (eff && eff.by === idx) ? (eff.dir === "asc" ? " ▲" : " ▼") : "";
    th.textContent = col.label + arrow;
    th.className = [col.hideSmall ? "col-hide-sm" : "", col.cls || "", col.sort ? "" : "nosort"].join(" ").trim();
    if(col.sort){
      th.onclick = ()=>{
        if(eff && eff.by === idx){
          ts.sortBy = idx; ts.sortDir = eff.dir === "asc" ? "desc" : "asc";
        } else {
          ts.sortBy = idx; ts.sortDir = col.type === "num" ? "desc" : "asc";
        }
        ts.page = 1;
        redraw();
      };
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  // body
  const tbody = document.createElement("tbody");
  pageRows.forEach(row=>{
    const tr = document.createElement("tr");
    if(cfg.onRowClick){
      tr.className = "clickable";
      tr.onclick = ()=>cfg.onRowClick(row);
    }
    if(cfg.select){
      const id = cfg.select.id(row);
      const td = document.createElement("td");
      td.className = "check-cell";
      if(cfg.stripe) td.style.boxShadow = "inset 6px 0 0 " + cfg.stripe(row);
      td.onclick = (e)=>e.stopPropagation();
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "row-check";
      cb.setAttribute("aria-label", TEXT.selectRowLabel);
      cb.checked = !!selMap[id];
      cb.onchange = ()=>{
        if(cb.checked) selMap[id] = true; else delete selMap[id];
        redraw();
      };
      td.appendChild(cb);
      tr.appendChild(td);
    } else if(cfg.stripe){
      const td = document.createElement("td");
      td.className = "stripe-cell";
      td.style.background = cfg.stripe(row);
      tr.appendChild(td);
    }
    cfg.columns.forEach(col=>{
      const td = document.createElement("td");
      td.className = [col.hideSmall ? "col-hide-sm" : "", col.wrap ? "cell-wrap" : "", col.cls || ""].join(" ").trim();
      const v = col.cell(row);
      if(v instanceof Node) td.appendChild(v);
      else td.textContent = (v === null || v === undefined) ? "" : String(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  // footer
  const pag = el("div", "report-pagination");
  const rangeEnd = Math.min(startIdx + pageSize, rows.length);
  pag.appendChild(el("div", null, `${TEXT.paginationShowing} ${startIdx + 1}–${rangeEnd} ${TEXT.paginationOf} ${rows.length}`));
  const controls = el("div");
  controls.style.display = "flex"; controls.style.alignItems = "center"; controls.style.gap = "18px"; controls.style.flexWrap = "wrap";
  controls.appendChild(pageSizeControl(ts.pageSize, (size)=>{ ts.pageSize = size; ts.page = 1; redraw(); }));
  if(totalPages > 1){
    const pager = el("div");
    pager.style.display = "flex"; pager.style.alignItems = "center"; pager.style.gap = "10px";
    const prevBtn = el("button", "page-btn", TEXT.paginationPrev);
    prevBtn.disabled = ts.page <= 1;
    prevBtn.onclick = ()=>{ ts.page -= 1; redraw(); };
    const nextBtn = el("button", "page-btn", TEXT.paginationNext);
    nextBtn.disabled = ts.page >= totalPages;
    nextBtn.onclick = ()=>{ ts.page += 1; redraw(); };
    pager.append(prevBtn, el("span", null, `${TEXT.paginationPage} ${ts.page} / ${totalPages}`), nextBtn);
    controls.appendChild(pager);
  }
  pag.appendChild(controls);
  wrap.appendChild(pag);
  frag.appendChild(wrap);
  return frag;
}

  }});
  cols.push({label:TEXT.colParts, type:"num", hideSmall:true, sort:x=>x.lines, cell:x=>String(x.lines)});
  cols.push({label:TEXT.colQty, type:"num", sort:x=>x.totalQty, cell:x=>String(x.totalQty)});

// Every request line, sorted by the current report sort — but not yet
// narrowed by the search box. Kept separate from reportRows() so checkbox
// selection (and "export selected") can see a row even if a later search
// temporarily filters it out of view, the same way the other tables' bulk
// selection survives their search box.
function reportRowsRaw(){
  let rows = [];
  state.requests.forEach(r=>{
    const tech = userById(r.technicianId);
    const client = customerNameOf(r);
    const reqLocName = requestedLocationNameOf(r);
    const dispLocName = dispatchLocationNameOf(r);
    requestItems(r).forEach(it=>{
      const part = partById(it.partId);
      rows.push({
        rowId: r.id + "::" + it.partId,
        req: r,
        qty: it.qty,
        techName: tech ? tech.name : "—",
        clientName: client,
        requestedLocationName: reqLocName,
        dispatchLocationName: dispLocName,
        partDesc: part ? part.description : "(removed part)",
        itemCode: part ? (part.itemCode||"") : "",
        catId: part ? ptype(part) : "",
        catName: part ? catName(ptype(part)) : "—"
      });
    });
  });
  rows.sort((a,b)=>{
    let av, bv;
    if(view.reportSortBy === "technician"){ av=a.techName.toLowerCase(); bv=b.techName.toLowerCase(); }
    else if(view.reportSortBy === "client"){ av=a.clientName.toLowerCase(); bv=b.clientName.toLowerCase(); }
    else if(view.reportSortBy === "category"){ av=a.catName.toLowerCase(); bv=b.catName.toLowerCase(); }
    else if(view.reportSortBy === "part"){ av=a.partDesc.toLowerCase(); bv=b.partDesc.toLowerCase(); }
    else if(view.reportSortBy === "qty"){ av=a.qty; bv=b.qty; }
    else if(view.reportSortBy === "status"){ av=a.req.status; bv=b.req.status; }
    else { av=a.req.createdAt; bv=b.req.createdAt; }
    if(av < bv) return view.reportSortDir === "asc" ? -1 : 1;
    if(av > bv) return view.reportSortDir === "asc" ? 1 : -1;
    return 0;
  });
  return rows;
}

function reportRows(){
  const q = view.reportSearch.trim().toLowerCase();
  let rows = reportRowsRaw();
  if(view.reportCat !== "all") rows = rows.filter(r=>r.catId===view.reportCat);
  if(q){
    rows = rows.filter(row =>
      row.techName.toLowerCase().includes(q) ||
      row.clientName.toLowerCase().includes(q) ||
      row.requestedLocationName.toLowerCase().includes(q) ||
      row.dispatchLocationName.toLowerCase().includes(q) ||
      row.partDesc.toLowerCase().includes(q) ||
      row.itemCode.toLowerCase().includes(q) ||
      row.catName.toLowerCase().includes(q) ||
      row.req.id.toLowerCase().includes(q) ||
      (row.req.notes || "").toLowerCase().includes(q) ||
      (row.req.managerNote || "").toLowerCase().includes(q)
    );
  }
  return rows;
}

function buildReportBody(){
  const frag = document.createElement("div");
  const rows = reportRows();

  // The select-bar (and its count) looks at every line, regardless of the

    const bar = el("div","select-bar");

  const trh = document.createElement("tr");

  const checkTh = document.createElement("th");
  checkTh.className = "check-cell nosort";

  allCb.type = "checkbox";
  allCb.className = "row-check";
  allCb.setAttribute("aria-label", TEXT.selectAllLabel);
  const nChecked = rows.filter(r=>selMap[r.rowId]).length;
  allCb.checked = rows.length > 0 && nChecked === rows.length;
  allCb.indeterminate = nChecked > 0 && nChecked < rows.length;

    rows.forEach(r=>{

        } else {
          view.reportSortBy = key;
          view.reportSortDir = "desc";
        }
        renderReportBodyOnly();
      };
    } else {
      th.style.cursor = "default";
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  pageRows.forEach(row=>{
    const tr = document.createElement("tr");

    const checkTd = document.createElement("td");
    checkTd.className = "check-cell";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "row-check";

    cb.checked = !!selMap[row.rowId];

      renderReportBodyOnly();
    };
    checkTd.appendChild(cb);
    tr.appendChild(checkTd);

    const cells = [
      fmtDateShort(row.req.createdAt),
      row.techName,

    ];
    cells.forEach(text=>{

      td.textContent = text;
      tr.appendChild(td);
    });
    const statusTd = document.createElement("td");

  table.appendChild(tbody);

  const rangeStart = rows.length === 0 ? 0 : startIdx + 1;

  pag.appendChild(info);

  controls.style.alignItems = "center";
  controls.style.gap = "18px";

  controls.appendChild(pageSizeControl(view.reportPageSize, (size)=>{ view.reportPageSize = size; view.reportPage = 1; renderReportBodyOnly(); }));
  if(totalPages > 1){
    const pager = el("div");
    pager.style.display = "flex"; pager.style.alignItems = "center"; pager.style.gap = "10px";
    const prevBtn = el("button","page-btn",TEXT.paginationPrev);

    const pageLabel = el("span", null, `${TEXT.paginationPage} ${view.reportPage} / ${totalPages}`);
    const nextBtn = el("button","page-btn",TEXT.paginationNext);
    nextBtn.disabled = view.reportPage >= totalPages;
    nextBtn.onclick = ()=>{ view.reportPage += 1; renderReportBodyOnly(); };
    pager.append(prevBtn, pageLabel, nextBtn);
    controls.appendChild(pager);
  }
  pag.appendChild(controls);

  wrap.appendChild(pag);
  frag.appendChild(wrap);
  return frag;
}

// onlySelected: export just the checked rows (regardless of the active
// search box) instead of everything currently matching the search.
function exportReportCSV(onlySelected){
  let rows;
  if(onlySelected){
    const selMap = selectionOf("report");
    rows = reportRowsRaw().filter(r=>selMap[r.rowId]);
  } else {
    rows = reportRows();
  }
  const header = ["Request ID","Date","Technician","Client","Requested Location","Dispatch Location","Item Code","Category","Item Description","Qty","Urgency","Status","Technician Notes","Warehouse Note"];
  const lines = [header.join(",")];
  rows.forEach(row=>{
    const cells = [
      row.req.id,
      fmtDateShort(row.req.createdAt),
      row.techName,
      row.clientName,
      row.requestedLocationName,
      row.dispatchLocationName,
      row.itemCode,
      row.catName,
      row.partDesc,
      row.qty,
      row.req.urgency,
      row.req.status,
      row.req.notes || "",
      row.req.managerNote || ""
    ].map(v=>{
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    });
    lines.push(cells.join(","));
  });
  downloadFile(onlySelected ? "line-summary-report-selected.csv" : "line-summary-report.csv", "text/csv", lines.join("\n"));
}
